name: Reportar un error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: ¿Qué pasó?
      description: Qué esperabas y qué ocurrió en su lugar.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Escribir 5 ÷ 0
        2. Pulsar =
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Sistema y versión de Python
      placeholder: Ubuntu 24.04, Python 3.12
    validations:
      required: true
